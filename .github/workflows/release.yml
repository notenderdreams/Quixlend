name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  BLENDER_VERSION: "5.2.4"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Tag matches manifest version
        run: |
          v=$(python3 -c 'import tomllib;print(tomllib.load(open("blender_manifest.toml","rb"))["version"])')
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != manifest v$v"; exit 1; }

      - run: just setup
      - run: just check

      - name: Cache Blender
        id: blender
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download Blender
        if: steps.blender.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/blender
          curl -fsSL "https://download.blender.org/release/Blender${BLENDER_VERSION%.*}/blender-${BLENDER_VERSION}-linux-x64.tar.xz" \
            | tar -xJ -C ~/blender --strip-components=1

      - name: Build extension + static repository
        run: |
          echo "$HOME/blender" >> "$GITHUB_PATH"
          just release

      - name: Show zip contents
        run: unzip -l dist/*.zip

      - name: Write release notes
        run: python3 scripts/release_notes.py > notes.md
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}

      - name: Publish
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/index.json \
            --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
