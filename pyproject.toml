[tool.ruff]
target-version = "py313"
line-length = 110
extend-exclude = ["assets", ".scratch"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]

ignore = ["E501", "RUF012", "E731", "B905"]  # formatter owns line length

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "B017"]

[tool.pyrefly]
search-path = [".venv/lib/python3.13/site-packages"]
python-interpreter-path = ".venv/bin/python"
